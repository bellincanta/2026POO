services:
   db:
     image: postgres:16-alpine
     container_name: estoque-db
     restart: unless-stopped
     environment:
       POSTGRES_USER: postgres
       POSTGRES_PASSWORD: postgres
       POSTGRES_DB: estoque
     ports:
       - '5432:5432'
     volumes:
       - dados-postgres:/var/lib/postgresql/data
volumes:
   dados-postgres: